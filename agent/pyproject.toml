[project]
name = "dispatch-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    # The supervisor's live-updates socket (app/main.py: _ws_connect).
    "websockets>=14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "langchain>=1.2",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    # The Copilot's conversations in Postgres (app/copilot/checkpoint.py).
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # IANA time zones for zoneinfo: Windows has no system database.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
